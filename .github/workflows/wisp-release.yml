name: Wisp Release

on:
  push:
    tags: ["v*-wisp.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the .deb, e.g. 1.4.0+wisp.1 (omit on tag-triggered runs)"
        required: false
        type: string

concurrency:
  group: wisp-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build numbers are the commit count.
          fetch-depth: 0

      # vX.Y.Z-wisp.N builds as X.Y.Z+wisp.N, once build.zig.zon is at X.Y.Z.
      - name: Version
        id: version
        run: |
          version=$(python3 dist/wisp/release_version.py "$GITHUB_REF_NAME" build.zig.zon)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: ./.github/actions/wisp-macos
        with:
          version-string: ${{ steps.version.outputs.version }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}

      # The stable feed is the latest release's appcast.xml.
      - name: Update appcast
        env:
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          dist/wisp/fetch-appcast.sh "$GITHUB_REPOSITORY" latest appcast-old.xml
          python3 dist/wisp/update_appcast.py \
            --channel stable \
            --version "$VERSION" \
            --build "$BUILD" \
            --commit "$(git rev-parse --short HEAD)" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Wisp.dmg" \
            --signature sign_update.txt \
            --appcast appcast-old.xml \
            --out appcast.xml

      - name: Publish
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          # A re-run replaces the release's files instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Wisp.dmg appcast.xml --clobber
          else
            gh release create "$GITHUB_REF_NAME" Wisp.dmg appcast.xml \
              --verify-tag --latest \
              --title "Wisp $VERSION" \
              --notes "Wisp $VERSION, built from $GITHUB_SHA."
          fi

      # Writes Casks/wisp.rb in callistobound/homebrew-tap. TAP_DEPLOY_KEY is a
      # deploy key with write access to that repo only.
      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::notice::TAP_DEPLOY_KEY isn't set; skipping the Homebrew cask"
            exit 0
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:callistobound/homebrew-tap.git tap
          python3 dist/wisp/cask.py stable "${GITHUB_REF_NAME#v}" \
            "$(shasum -a 256 Wisp.dmg | awk '{print $1}')" > tap/Casks/wisp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wisp.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "wisp ${GITHUB_REF_NAME#v}"
            git push
          fi

  build-deb:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            git python3 python3-pip python3-gi python3-gi-cairo \
            pkg-config pandoc gettext \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl-dev gobject-introspection libglib2.0-dev \
            wayland-protocols libwayland-dev libwayland-bin \
            curl xz-utils ca-certificates dpkg-dev \
            nodejs
          # Install blueprint-compiler >= 0.20.0 (distro pkg is too old).
          # --no-deps relies on system python3-gi for the PyGObject import.
          pip3 install --break-system-packages --no-deps 'blueprint-compiler>=0.20.0'

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -q
          apt-get install -y gh

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(python3 dist/wisp/release_version.py "$GITHUB_REF_NAME" build.zig.zon)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare source
        run: |
          # Wrap pandoc to disable tex_math_dollars, which misparses $XDG_CONFIG_HOME
          # in the docs as the start of a TeX math expression.
          printf '#!/bin/sh\nexec /usr/bin/pandoc "$@" -f markdown-tex_math_dollars\n' \
            > /usr/local/bin/pandoc
          chmod +x /usr/local/bin/pandoc

      - name: Build
        run: |
          zig build install \
            --prefix staging/usr \
            -Doptimize=ReleaseFast \
            "-Dversion-string=${{ steps.version.outputs.version }}" \
            -Dinstalled-exe-path=/usr/bin/wisp \
            -fno-sys=gtk4-layer-shell

      - name: Package .deb
        run: |
          DEB="wisp_${{ steps.version.outputs.version }}_amd64.deb"
          bash dist/wisp/make_deb.sh "${{ steps.version.outputs.version }}" staging "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload to release
        if: github.event_name == 'push'
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.deb }}" \
            --clobber

      - name: Upload artifact (manual test)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-deb
          path: "*.deb"
