name: Wisp Build Check

on:
  push:
    branches: ["downstream"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wisp-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            git python3 python3-pip python3-gi python3-gi-cairo \
            pkg-config pandoc gettext \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl-dev gobject-introspection libglib2.0-dev \
            wayland-protocols libwayland-dev libwayland-bin \
            curl xz-utils ca-certificates \
            nodejs
          pip3 install --break-system-packages --no-deps 'blueprint-compiler>=0.20.0'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Prepare source
        run: |
          printf '#!/bin/sh\nexec /usr/bin/pandoc "$@" -f markdown-tex_math_dollars\n' \
            > /usr/local/bin/pandoc
          chmod +x /usr/local/bin/pandoc

      - name: Build
        run: |
          zig build -fno-sys=gtk4-layer-shell

  build-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Build
        run: |
          zig build -Demit-macos-app=false
